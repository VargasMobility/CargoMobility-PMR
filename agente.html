<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel agente PMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
    }
    .topbar {
      padding: 10px 14px;
      background: linear-gradient(90deg,#0f172a,#1e293b);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
    }
    .badge {
      padding:2px 8px;
      border-radius:999px;
      font-size:11px;
      border:1px solid #22c55e33;
    }
    .container {
      padding:12px;
    }
    .card {
      background:#020617;
      border-radius:12px;
      border:1px solid #1f2937;
      padding:12px;
      margin-bottom:10px;
    }
    .btn {
      border:none;
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
      cursor:pointer;
      background:#22c55e;
      color:#020617;
      font-weight:600;
    }
    label {
      display:block;
      margin-bottom:6px;
      font-size:13px;
    }
    input, select {
      width:100%;
      padding:6px 8px;
      border-radius:8px;
      border:1px solid #1f2937;
      background:#020617;
      color:#e5e7eb;
      font-size:13px;
      margin-top:2px;
    }
    .msg {
      font-size:12px;
      margin-top:6px;
      min-height:16px;
      color:#e5e7eb;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>Agente PMR</div>
    <div class="badge" id="estado-api-agente">Conectando...</div>
  </div>
  <div class="container">
    <div class="card" id="card-login">
      <label>ID Agente
        <input type="text" id="login-id-agente" placeholder="Ej: AG-0001">
      </label>
      <button class="btn" id="btn-login-agente">Ingresar</button>
      <div class="msg" id="msg-login-agente"></div>
    </div>

    <div class="card" id="card-asignaciones" style="display:none;">
      <div style="font-size:14px; margin-bottom:6px;">
        Mis asignaciones pendientes
      </div>
      <div id="lista-asignaciones"></div>
    </div>
  </div>

</body>
</html>
